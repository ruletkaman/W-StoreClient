<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSTORE | Отслеживание посылки</title>
    <meta name="description" content="Отследите статус вашей посылки WSTORE в реальном времени">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg-base: #08080a;
          --bg-surface: #111114;
          --bg-card: #16161a;
          --bg-elevated: #1c1c22;
          --bg-hover: #222228;
          --border-default: #2a2a30;
          --border-light: #35353c;
          --accent: #c8a750;
          --accent-light: #d4b96a;
          --accent-dim: rgba(200, 167, 80, 0.12);
          --accent-glow: rgba(200, 167, 80, 0.25);
          --text-primary: #eeeeef;
          --text-secondary: #9a9aa0;
          --text-muted: #5c5c64;
          --success: #3dd68c;
          --success-dim: rgba(61, 214, 140, 0.12);
          --error: #f06060;
          --error-dim: rgba(240, 96, 96, 0.12);
          --radius-sm: 8px;
          --radius-md: 12px;
          --radius-lg: 16px;
          --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
          --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(200, 167, 80, 0.03) 0%, transparent 60%),
                              radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-base) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            width: 100%;
            max-width: 560px;
        }

        /* ── Views ── */
        .view {
            display: none;
        }
        .view.active {
            display: block;
            animation: viewIn 0.5s ease-out;
        }

        @keyframes viewIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Card ── */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow), 0 0 80px rgba(200, 167, 80, 0.03);
            padding: 40px 32px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
        }

        @media (max-width: 560px) {
            .card { padding: 28px 20px; }
        }

        /* ── Search View ── */
        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .search-form {
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            padding: 0 16px;
            border-radius: var(--radius-md);
            height: 52px;
            transition: var(--transition);
            outline: none;
        }
        .search-input::placeholder {
            color: var(--text-muted);
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .search-btn {
            height: 52px;
            width: 52px;
            min-width: 52px;
            background-color: var(--accent);
            color: #0a0a0a;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover {
            background-color: var(--accent-light);
            transform: scale(1.04);
        }
        .search-btn:active {
            transform: scale(0.96);
        }
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .search-btn .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(10, 10, 10, 0.2);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Result View ── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 0;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .back-btn:hover {
            color: var(--text-primary);
        }

        .track-info {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-default);
        }
        .track-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }
        .track-number {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--accent);
        }

        /* ── Timeline ── */
        .timeline {
            position: relative;
            padding-left: 28px;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 40px;
            padding-left: 20px;
            opacity: 0;
            transform: translateX(-8px);
            animation: itemIn 0.4s ease-out forwards;
        }
        .timeline-item:last-child {
            padding-bottom: 0;
        }

        @keyframes itemIn {
            to { opacity: 1; transform: translateX(0); }
        }

        /* Connecting line */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 20px;
            bottom: -20px;
            width: 2px;
        }
        .timeline-item:last-child::before {
            display: none;
        }

        /* Dot */
        .timeline-dot {
            position: absolute;
            left: -8px;
            top: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            z-index: 2;
            transition: var(--transition);
        }

        /* ── Status: Completed ── */
        .timeline-item.completed .timeline-dot {
            background: var(--success);
            border: 3px solid var(--success);
            box-shadow: 0 0 8px var(--success-dim);
        }
        .timeline-item.completed::before {
            background: var(--success);
            opacity: 0.5;
        }
        .timeline-item.completed .cp-title {
            color: var(--text-primary);
        }
        .timeline-item.completed .cp-date {
            color: var(--text-secondary);
        }

        /* ── Status: Active ── */
        .timeline-item.active .timeline-dot {
            background: var(--accent);
            border: 3px solid var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        .timeline-item.active::before {
            background: linear-gradient(to bottom, var(--accent) 0%, var(--border-light) 100%);
            opacity: 0.4;
        }
        .timeline-item.active .cp-title {
            color: var(--accent-light);
        }
        .timeline-item.active .cp-date {
            color: var(--text-secondary);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 var(--accent-glow);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(200, 167, 80, 0);
                transform: scale(1.25);
            }
        }

        /* ── Status: Pending ── */
        .timeline-item.pending .timeline-dot {
            background: var(--bg-card);
            border: 2px solid var(--border-light);
        }
        .timeline-item.pending::before {
            background: repeating-linear-gradient(
                to bottom,
                var(--border-light) 0px,
                var(--border-light) 4px,
                transparent 4px,
                transparent 8px
            );
            opacity: 0.5;
        }
        .timeline-item.pending .cp-title,
        .timeline-item.pending .cp-date {
            color: var(--text-muted);
        }

        /* Checkpoint text */
        .cp-title {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
            transition: var(--transition);
        }
        .cp-emoji {
            margin-right: 6px;
        }
        .cp-date {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .empty-message {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 15px;
        }
        .empty-message .empty-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ── Error View ── */
        .error-content {
            text-align: center;
            padding: 16px 0;
        }
        .error-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--error-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .error-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error-message {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .retry-btn {
            width: 100%;
            height: 48px;
            background: transparent;
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .retry-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-light);
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Search View -->
        <div id="searchView" class="view active">
            <div class="card">
                <div class="brand">WSTORE</div>
                <h1>Отслеживание посылки</h1>
                <p class="subtitle">Введите трек-номер для проверки статуса</p>
                <form id="searchForm" class="search-form" autocomplete="off">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="trackInput"
                            class="search-input"
                            placeholder="Трек-номер"
                            aria-label="Трек-номер"
                            inputmode="numeric"
                            required
                        >
                    </div>
                    <button type="submit" class="search-btn" id="searchBtn" aria-label="Найти">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <div class="spinner" id="searchSpinner"></div>
                    </button>
                </form>
            </div>
            <div class="footer">Powered by WSTORE Tracking</div>
        </div>

        <!-- Result View -->
        <div id="resultView" class="view">
            <div class="card">
                <button class="back-btn" id="backBtn" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Назад
                </button>
                <div class="track-info">
                    <div class="track-label">Трек-номер</div>
                    <div class="track-number" id="displayTrackNumber"></div>
                </div>
                <div class="timeline" id="timelineContainer"></div>
            </div>
        </div>

        <!-- Error View -->
        <div id="errorView" class="view">
            <div class="card">
                <div class="error-content">
                    <div class="error-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <div class="error-title">Заказ не найден</div>
                    <div class="error-message">Проверьте правильность трек-номера и попробуйте снова</div>
                    <button class="retry-btn" id="retryBtn" type="button">Попробовать снова</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLbc-XyndqVjdCAfMtCnd6iWPAkbNkfs8",
            authDomain: "wshoptrack.firebaseapp.com",
            databaseURL: "https://wshoptrack-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "wshoptrack",
            storageBucket: "wshoptrack.firebasestorage.app",
            messagingSenderId: "691281337852",
            appId: "1:691281337852:web:7e804269112c7a62e1e679"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ── DOM Elements ──
        const $ = (id) => document.getElementById(id);
        const searchView   = $('searchView');
        const resultView   = $('resultView');
        const errorView    = $('errorView');
        const searchForm   = $('searchForm');
        const trackInput   = $('trackInput');
        const searchBtn    = $('searchBtn');
        const searchSpinner = $('searchSpinner');
        const searchIcon   = searchBtn.querySelector('.search-icon');
        const backBtn      = $('backBtn');
        const retryBtn     = $('retryBtn');
        const displayTrack = $('displayTrackNumber');
        const timelineCont = $('timelineContainer');

        let unsubscribe = null; // Firebase listener cleanup function

        // ── View Management ──
        function showView(view) {
            [searchView, resultView, errorView].forEach(v => {
                v.classList.remove('active');
            });
            // Small delay for exit animation feel
            requestAnimationFrame(() => {
                view.classList.add('active');
            });
        }

        function setLoading(loading) {
            searchBtn.disabled = loading;
            trackInput.disabled = loading;
            searchSpinner.style.display = loading ? 'block' : 'none';
            searchIcon.style.display = loading ? 'none' : 'block';
        }

        // ── Escape HTML to prevent XSS ──
        function esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // ── Parse checkpoints from Firebase ──
        // Firebase may store as object {0: {...}, 1: {...}} or array — normalize to array
        function parseCheckpoints(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.filter(Boolean);
            // Object with numeric keys
            const keys = Object.keys(raw).map(Number).filter(k => !isNaN(k)).sort((a, b) => a - b);
            return keys.map(k => raw[k]).filter(Boolean);
        }

        // ── Render Timeline ──
        function renderTimeline(data) {
            timelineCont.innerHTML = '';

            const checkpoints = parseCheckpoints(data.checkpoints);
            const currentStep = typeof data.currentStep === 'number' ? data.currentStep : 0;

            if (checkpoints.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.innerHTML = '<div class="empty-icon">⏳</div>Заказ обрабатывается';
                timelineCont.appendChild(empty);
                return;
            }

            checkpoints.forEach((cp, idx) => {
                let status = 'pending';
                if (idx < currentStep) status = 'completed';
                else if (idx === currentStep) status = 'active';

                const item = document.createElement('div');
                item.className = `timeline-item ${status}`;
                item.style.animationDelay = `${idx * 0.12}s`;

                // Dot
                const dot = document.createElement('div');
                dot.className = 'timeline-dot';

                // Content wrapper
                const content = document.createElement('div');

                // Title
                const titleEl = document.createElement('div');
                titleEl.className = 'cp-title';
                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'cp-emoji';
                emojiSpan.textContent = cp.emoji || '';
                const titleText = document.createTextNode(cp.title || '');
                titleEl.appendChild(emojiSpan);
                titleEl.appendChild(titleText);
                content.appendChild(titleEl);

                // Date range
                if (cp.dateRange) {
                    const dateEl = document.createElement('div');
                    dateEl.className = 'cp-date';
                    dateEl.textContent = cp.dateRange;
                    content.appendChild(dateEl);
                }

                item.appendChild(dot);
                item.appendChild(content);
                timelineCont.appendChild(item);
            });
        }

        // ── Firebase Tracking ──
        function cleanupListener() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
        }

        function fetchTracking(trackNumber) {
            setLoading(true);
            cleanupListener();

            const orderRef = ref(db, `orders/${trackNumber}`);

            // onValue returns an unsubscribe function in v10
            unsubscribe = onValue(orderRef, (snapshot) => {
                setLoading(false);
                const data = snapshot.val();

                if (data) {
                    displayTrack.textContent = trackNumber;
                    renderTimeline(data);
                    if (!resultView.classList.contains('active')) {
                        showView(resultView);
                    }
                } else {
                    cleanupListener();
                    showView(errorView);
                }
            }, (error) => {
                console.error('Firebase read error:', error);
                setLoading(false);
                cleanupListener();
                showView(errorView);
            });
        }

        // ── Event Handlers ──
        let searchTimeout = null;

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            clearTimeout(searchTimeout);
            const value = trackInput.value.trim();
            if (!value) return;
            searchTimeout = setTimeout(() => fetchTracking(value), 150);
        });

        backBtn.addEventListener('click', () => {
            cleanupListener();
            timelineCont.innerHTML = '';
            showView(searchView);
            setTimeout(() => trackInput.focus(), 300);
        });

        retryBtn.addEventListener('click', () => {
            showView(searchView);
            setTimeout(() => {
                trackInput.focus();
                trackInput.select();
            }, 300);
        });

        // Auto-focus on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => trackInput.focus(), 400);
        });
    </script>
</body>
</html>
